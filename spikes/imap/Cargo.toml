[package]
name = "imap-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
tokio = "1"

[dev-dependencies]
imap-proto = "0.17"
imap-next = { version = "0.3", features = ["stream", "expose_stream", "ext_condstore_qresync"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# imap-codec 2.0.0-alpha.9 uses nom 7 with default features off and never turns on `alloc`,
# so it does not build alone. This line is the workaround.
nom = { version = "7", features = ["alloc"] }
