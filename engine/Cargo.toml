[package]
name = "dovecote-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
hickory-resolver = "0.26.3"
keyring = { version = "3", features = ["apple-native"] }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "webpki-roots", "smtp-transport", "builder", "ring"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
rcgen = "0.14.10"
